name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Validate evaluation manifest
        run: npm run evaluation:validate
      - name: Generate deterministic evaluation fixtures
        run: npm run evaluation:fixtures
      - name: Run evaluation tests
        run: npm run evaluation:test
      - name: Run free evaluation dry-run
        run: npm run evaluation:dry-run
      - name: Typecheck
        run: npm run typecheck
      - name: Run benchmark tests
        run: npm run benchmark:test
      - name: Run performance benchmark
        run: npm run benchmark
      - name: Check package contents
        run: npm pack --dry-run
